# dotfiles · tmux
#
# Nothing palette, no plugin manager, no TPM. Everything here is native tmux 3.8:
# the theme follows the terminal's light/dark background, the status line is one
# red accent on black, and the popups (yazi, btop, sessions) are display-popup, 
# nothing runs in the background between keypresses.
#
# Convention kept on purpose: prefix stays C-b (every tutorial and every muscle
# memory assumes it); C-a works as prefix2 for screen people. Panes move with
# Alt+hjkl so C-hjkl stays free for Neovim splits.
#
# Reload: prefix + r.  Structure: behaviour · keys · panes · copy · status · popups.

# ── colours ──────────────────────────────────────────────────────────────────
# Glyph tokens, defined twice so `theme detect` can follow the terminal.
# Styles below only ever use themeblack/themewhite/themedarkgrey/themelightgrey/
# themered, which tmux resolves per client background. Nothing else is hardcoded.
set -g theme detect

set -g dark-theme-black      "#0E0E0E"
set -g dark-theme-dark-grey  "#2A2A2A"
set -g dark-theme-light-grey "#6E6E6E"
set -g dark-theme-white      "#F2F2F2"
set -g dark-theme-red        "#D71921"
set -g dark-theme-green      "#9BB59A"
set -g dark-theme-yellow     "#D9C38A"
set -g dark-theme-blue       "#8EA3C2"
set -g dark-theme-cyan       "#8FB8B8"
set -g dark-theme-magenta    "#B79BC2"

# Light: black and white swap roles so the palette stays "ink on paper".
set -g light-theme-black      "#F2F2F2"
set -g light-theme-dark-grey  "#C9C9C9"
set -g light-theme-light-grey "#8A8A8A"
set -g light-theme-white      "#0E0E0E"
set -g light-theme-red        "#D71921"
set -g light-theme-green      "#5F7A5E"
set -g light-theme-yellow     "#8A7434"
set -g light-theme-blue       "#4C6487"
set -g light-theme-cyan       "#4E7A7A"
set -g light-theme-magenta    "#7C5C86"

# ── terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:focus:osc7"
set -ga terminal-features ",xterm-256color:RGB:extkeys:hyperlinks"
set -g escape-time 0                  # no lag on Esc in vi mode
set -g focus-events on                # nvim focus autocmds work through tmux
# 20000 lines per pane is roughly 4 MB of grid; 50000 was 10 MB per pane for
# scrollback nobody reaches. The copy-mode search and the status bar work the
# same either way.
set -g history-limit 20000
set -g allow-passthrough on           # yazi image previews inside tmux
set -s extended-keys on               # Alt/Ctrl+Shift chords reach nvim
set -s extended-keys-format csi-u
set -s set-clipboard on               # copy mode → system clipboard (OSC 52)
set -g set-titles on                  # Hyprland window title shows the session
set -g set-titles-string "#{session_name} · #{window_name}"

# ── behaviour ────────────────────────────────────────────────────────────────
set -g base-index 1
set -gw pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off          # closing a session lands on the next one
set -g focus-follows-mouse off
set -g display-time 1500
set -g visual-activity off
set -g visual-bell off
set -g monitor-activity on
set -g automatic-rename on
set -gw automatic-rename-format "#{pane_current_command}"
set -g mouse on
set -g prompt-history-limit 500
set -s history-file ~/.local/share/tmux/command-history

# ── prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix
set -g repeat-time 500

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux: reloaded"
bind R run-shell "tmux source-file ~/.config/tmux/tmux.conf"   # same, no message

# ── open things where you are ────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"    # C-b \ (AltGr layouts)
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── panes: Alt+hjkl moves, Alt+Shift+hjkl resizes ───────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r -n M-H resize-pane -L 5
bind -r -n M-J resize-pane -D 5
bind -r -n M-K resize-pane -U 5
bind -r -n M-L resize-pane -R 5

# vi-ish pane grammar on the prefix too
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-pane -t :.+            # cycle
bind q display-panes                 # pane numbers
bind m display-menu -T "#[align=centre]pane" \
  -x P -y P \
  "Break pane" b "break-pane" \
  "Swap left"  l "swap-pane -L" \
  "Swap right" r "swap-pane -R" \
  "Zoom"       z "resize-pane -Z" \
  "Kill"       k "kill-pane"

# ── windows ──────────────────────────────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind C-o rotate-window
bind X kill-pane                     # C-b X, not a vi key
bind & kill-window
bind w choose-tree -Zw               # window/session tree, zoomed
bind s choose-tree -Zs               # session tree, zoomed
bind F command-prompt "find-window -N -Z '%%'"

# ── panes look ───────────────────────────────────────────────────────────────
set -gw pane-border-lines single
set -gw pane-border-indicators colour
set -gw pane-border-style "fg=themedarkgrey"
set -gw pane-active-border-style "fg=themered"
set -g pane-border-status top
set -gw pane-border-format "#[fg=themedarkgrey] #{pane_index} #[fg=themelightgrey]#{pane_current_command} "
set -gw pane-status-style "bg=themeblack"
set -gw pane-status-current-style "bg=themeblack,fg=themewhite,bold"
set -gw pane-scrollbars auto-hide
set -gw pane-scrollbars-style "fg=themedarkgrey,bg=themeblack,width=1"
set -gw pane-scrollbars-position right
set -gw pane-scrollbars-timeout 1200
set -gw clock-mode-colour themered
set -g window-size latest
set -gw tiled-layout-max-columns 4
set -g message-style "bg=themeblack,fg=themewhite"
set -g message-command-style "bg=themeblack,fg=themered"
set -gw display-panes-colour themelightgrey
set -gw display-panes-active-colour themered

# ── copy mode: vi keys, mouse drag copies ───────────────────────────────────
set -gw mode-keys vi
set -gw mode-style "fg=themeblack,bg=themewhite"
set -gw copy-mode-match-style "fg=themeblack,bg=themeyellow"
set -gw copy-mode-current-match-style "fg=themeblack,bg=themered"
set -gw copy-mode-line-numbers absolute

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-line
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-backward

# wheel scrolls the pager that is running, or enters copy mode
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane if-shell -F -t = "#{pane_in_mode}" "send-keys -M" ""

# ── status line: the prompt's grammar, one red live thing ──────────────────
# Same language as starship: name in white, metadata in grey, `·` between the
# two, red for the only thing that is live right now.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=themeblack,fg=themelightgrey"
set -g status-justify left
set -g status-left-length 56
set -g status-right-length 72

# left: the session, then where the active pane actually is
set -g status-left "#[fg=themered]● #[fg=themewhite,bold]#S #[fg=themedarkgrey]· #[fg=themelightgrey]#{b:pane_current_path} #{?client_prefix,#[fg=themered]PREFIX#[fg=themedarkgrey],}"

# right: transient state first, then host and time
set -g status-right "#{?window_zoomed_flag,#[fg=themered]ZOOM #[fg=themedarkgrey],}#{?pane_in_mode,#[fg=themered]COPY #[fg=themedarkgrey],}#{?synchronize-panes,#[fg=themered]SYNC #[fg=themedarkgrey],}#[fg=themedarkgrey]#{host_short} #[fg=themelightgrey]%H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=themedarkgrey] #I #[fg=themelightgrey]#W "
set -g window-status-current-format "#[fg=themered,bold] #I #[fg=themewhite,bold]#W "
set -g window-status-activity-style "fg=themelightgrey"
set -g window-status-bell-style "fg=themered,bold"

# ── popups ───────────────────────────────────────────────────────────────────
# Floating, themed, and they exit back into the pane you came from.
set -gw popup-style "bg=themeblack,fg=themewhite"
set -gw popup-border-style "fg=themedarkgrey"
set -gw popup-border-lines rounded

bind e display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "yazi"
bind -n M-e display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "yazi"
bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"
bind b display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "btop"
bind S display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "~/.config/tmux/scripts/sessions.sh"
bind -n M-s display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "~/.config/tmux/scripts/sessions.sh"

# ── persistence ─────────────────────────────────────────────────────────────
# Continuum saves the session layout every 15 minutes and resurrect restores it
# on start, so a reboot does not lose the windows you had open. Two plugins,
# sourced directly: TPM would be a plugin manager that has to install itself
# before it can install plugins, and it wants a network round trip at every
# start. install.sh clones these two into ~/.config/tmux/plugins/ once.
#
# The if-shell guards matter: without them every tmux start prints a
# "not found" line for as long as the clone has not happened yet.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
if-shell 'test -d ~/.config/tmux/plugins/tmux-resurrect' \
    'run-shell -b ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -d ~/.config/tmux/plugins/tmux-continuum' \
    'run-shell -b ~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# ── local overrides ──────────────────────────────────────────────────────────
# Machine-specific odds and ends live outside the repo, like the ghostty include.
# The palette block above can be regenerated by the Glyph shell; this file always
# wins last because it is sourced at the end.
source-file -q ~/.config/tmux/local.conf
