[uses.easyeffects]
bin = "easyeffects"
where = "keybind Super+Shift+E, effects bypass toggle"
breaks = "that bind does nothing"

# ── apps ────────────────────────────────────────────────────────────────────
[uses.dolphin]
bin = "dolphin"
where = "variables.lua fileExplorer; Prefs > SYSTEM checks it"
breaks = "the file-explorer bind does nothing (yazi can replace it)"

[uses.vscodium]
bin = "codium"
where = "variables.lua apps.editor (Super+Shift+K); Prefs > SYSTEM checks it"
breaks = "the editor bind does nothing"

# ── yazi extras ─────────────────────────────────────────────────────────────
[uses.udisks2]
bin = "udisksctl"
where = "yazi mount plugin (key M), Dolphin removable media"
breaks = "the mount manager lists nothing"

[uses.perl-image-exiftool]
bin = "exiftool"
where = "yazi `reveal` opener, EXIF entry"
breaks = "the EXIF action prints nothing"

# ── updates ─────────────────────────────────────────────────────────────────
[uses.pacman-contrib]
bin = "checkupdates"
where = "glyph/system/package-updates.sh, official-repo branch"
breaks = "falls back to a fakeroot pacman -Sy, slower, still works"

# ── geo ─────────────────────────────────────────────────────────────────────
[uses.geoclue]
bin = "/usr/lib/geoclue-2.0/demos/agent"
where = "execs.lua starts the agent; services/Weather.qml reads its location"
breaks = "weather falls back to ipinfo.io"

# ── aur theming ─────────────────────────────────────────────────────────────
[uses.qtengine]
bin = "qtengine"
where = "Qt platform theme; reads ~/.config/qtengine.colors (generated by Apply.apps())"
breaks = "Qt apps ignore the palette"

[uses.darkly-bin]
bin = "Darkly"
where = "the Qt style qtengine drives"
breaks = "Qt apps fall back to Fusion"

# ── aur cursor ──────────────────────────────────────────────────────────────
[uses.bibata-cursor-theme-bin]
bin = "Bibata"
where = "variables.lua cursorTheme; execs.lua does hyprctl setcursor + gsettings"
breaks = "stock cursor"

# ── flatpak ─────────────────────────────────────────────────────────────────
[uses.flatpak-apps]
bin = "app.zen_browser.zen"
where = "variables.lua browser = flatpak run app.zen_browser.zen"
breaks = "the browser bind does nothing"
note = "manifest key is the flatpak app id, not a package"

# ── greeter ─────────────────────────────────────────────────────────────────
[uses.sddm]
bin = "sddm"
where = "install.sh --sddm copies config/sddm/glyph and writes zz-glyph.conf"
breaks = "no graphical login; this machine boots Hyprland directly"

# ── thinkpad ────────────────────────────────────────────────────────────────
[uses.thinkfan]
bin = "thinkfan"
where = "owns /proc/acpi/ibm/fan; /usr/local/bin/reddot-thinkpad rewrites /etc/thinkfan.yaml and restarts the service"
breaks = "fan curve page cannot apply; LEDs still work"
note = "AUR: not in the official repos"
