breaks = "CJK renders as boxes"

[uses.noto-fonts-emoji]
bin = "Noto Color Emoji"
where = "charms emoji picker"
breaks = "emoji render as boxes"

# ── icons ───────────────────────────────────────────────────────────────────
[uses.papirus-icon-theme]
bin = "Papirus"
where = "folder colour theme (`grey` in glyph/term/folders), applied by rice"
