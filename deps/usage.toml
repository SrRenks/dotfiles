[uses.fzf]
bin = "fzf"
where = "fish Ctrl+R/Ctrl+T/Alt+C, tmux sessions popup, fif"
breaks = "every picker"

[uses.bat]
bin = "bat"
where = "`cat` alias, fif preview, MANPAGER, yazi's text preview"
breaks = "cat loses its palette, man pages lose highlighting"

[uses.ripgrep]
bin = "rg"
where = "fish `fif` (search → fzf → nvim), yazi `search --via=rg` (key S), FZF_DEFAULT_COMMAND fallback"
breaks = "content search in yazi and fif do nothing"

[uses.7zip]
bin = "7z"
where = "yazi archive preview and the extract opener; fish `extract`"
breaks = "archives stop previewing and extracting"

[uses.ffmpeg]
bin = "ffmpeg"
where = "yazi video previewer (frames), ffprobe metadata"
breaks = "video previews show nothing"

[uses.poppler]
bin = "pdftoppm"
where = "yazi PDF previewer"
breaks = "PDF previews blank"

[uses.lazygit]
bin = "lazygit"
where = "tmux popup (prefix+g), fish `lg` abbr"
breaks = "the git popup exits immediately"

[uses.mpv]
bin = "mpv"
where = "yazi `play` opener, video and audio"
breaks = "opening media falls back to xdg-open"

[uses.btop]
bin = "btop"
where = "tmux popup (prefix+b)"
breaks = "the btop popup exits immediately"

[uses.cava]
bin = "cava"
where = "services/Cava.qml runs it with glyph/cava/cava.conf; `cava` alias uses the dots profile"
breaks = "the bar's spectrum widget is empty"

[uses.fastfetch]
bin = "fastfetch"
where = "stow/fastfetch config (hub); reddoted's copy is currently missing"
breaks = "fastfetch prints its stock output"

# ── fonts ───────────────────────────────────────────────────────────────────
[uses.ttf-jetbrains-mono-nerd]
bin = "JetBrainsMono Nerd Font"
