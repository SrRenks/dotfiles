# AUTOSTART CONFIG

exec-once = dbus-update-activation-environment --systemd XDG_CURRENT_DESKTOP=Hyprland WAYLAND_DISPLAY DISPLAY
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = awww-daemon
exec-once = hypridle
exec-once = nm-applet

exec-once = waybar && dunst
exec-once = clipse -listen

# Battery / system scripts
exec = ~/.local/bin/battery_chargin.sh
exec = ~/.local/bin/battery_low.sh
exec = ~/.local/bin/battery_high.sh && ~/.local/bin/wifi_alert.sh
